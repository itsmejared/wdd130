<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Home | White Water Rafting</title>
    <meta name="description" content="Home page for the raft site by Jared Huayta">
    <meta name="author" content="Jared Huayta">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
    </noscript>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raftinglogo.png" alt="Rafting logo" />
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main><!-- Hero Section -->
        <div class="hero">
            <img src="images/hero_home.jpg" alt="Rafting Adventure" class="hero-image" />
            <h1>Feel the Thrill of White Water Rafting!</h1>
        </div>
        <section class="contact-form">
            <h2>Subscribe to Our Newsletter</h2>
            <form>
                <div class="form-row">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-row">
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </section>
        <article class="cta-hero">
            <img src="images/cta_home.jpg" alt="Rafting Adventure" class="cta-image">
            <div class="cta-content">
                <h2>Ready for an Adventure?</h2>
                <p>Check out our thrilling rafting trips and choose your next adventure!</p>
                <a href="trips.html" class="btn">See Our Trips</a>
            </div>
        </article>
        <section class="home-info">
            <h2>Our Purpose & Offerings</h2>
            <div class="info-grid">
                <figure>
                    <img src="images/rafting1.jpg" alt="Exciting Rapids">
                    <figcaption>
                        <h3>Thrilling Rapids</h3>
                        <p>Feel the rush of adventure as you navigate through fast-flowing white water.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/rafting2.jpg" alt="Teamwork & Fun">
                    <figcaption>
                        <h3>Teamwork & Fun</h3>
                        <p>Rafting is all about camaraderie. Share laughs, challenges, and victories with your team.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/rafting3.jpg" alt="Scenic Views">
                    <figcaption>
                        <h3>Scenic Views</h3>
                        <p>Enjoy breathtaking landscapes and unforgettable moments along the river.</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 | White Water Rafting | Jared Huayta</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com"><img src="images/fb.svg" alt="Social Network Facebook" /></a>
            <a href="https://www.instagram.com"><img src="images/ig.svg" alt="Social Network Instagram" /></a>
            <a href="https://www.tiktok.com"><img src="images/tiktok.svg" alt="Social Network Tiktok" /></a>
        </nav>
    </footer>
</body>

</html>
